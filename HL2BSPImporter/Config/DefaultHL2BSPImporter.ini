[/Script/HL2BSPImporter.HL2BSPImporterSettings]
WorldScale=2.54
bFlipYZ=True
; Leave empty to use plugin fallback at Plugins/HL2BSPImporter/Resources/Materials.json
MaterialJsonPath=
bBuildNanite=True
bImportCollision=True
bImportPropsAsInstances=False

; --- Static-prop mesh import (Phase 12) ---
; When True the factory parses each unique prop_static .mdl/.vvd/.dx90.vtx
; triple under SourceContentRoots / pakfile and synthesises one UStaticMesh
; per unique model under SynthesizedAssetRoot/Props/<model path>. Each
; FHL2StaticProp DataTable row's StaticMeshAsset is then populated.
; Default off until validated against more community maps; failed lookups
; leave the row's StaticMeshAsset empty.
bImportStaticPropMeshes=False

; --- Displacement seam stitching (Phase 2b) ---
; Welds coincident perimeter vertices across neighbouring displacement grids to
; eliminate T-junction hairline cracks at terrain seams. Distance is in Unreal cm.
bStitchDisplacementSeams=True
DisplacementSeamWeldDistance=1.0

; --- Material synthesis (Phase 5) ---
; When True, slots without an explicit JSON mapping are synthesized from .vmt
; files located under SourceContentRoots. See README.md for details.
bSynthesizeMaterials=True

; Filesystem directories that contain a `materials/` (and optionally `textures/`)
; subtree. Add one entry per root, e.g.:
; +SourceContentRoots="C:/HL2Extract/hl2"
; +SourceContentRoots="C:/HL2Extract/hl2_misc"

; Where synthesized assets are written. Must start with /Game/.
SynthesizedAssetRoot=/Game/HL2/Imported

; Parent master materials. Defaults point at the assets shipped under the
; plugin's Content/MasterMaterials folder (Phase 11a). Override per project
; by repointing any slot at your own UMaterial asset that exposes the same
; parameter contract (see Resources/MasterMaterials/README.md).
ParentMaterial_LightmappedGeneric=/HL2BSPImporter/MasterMaterials/M_HL2_Lit.M_HL2_Lit
ParentMaterial_LightmappedGeneric_Masked=/HL2BSPImporter/MasterMaterials/M_HL2_LitMasked.M_HL2_LitMasked
ParentMaterial_LightmappedGeneric_Translucent=/HL2BSPImporter/MasterMaterials/M_HL2_LitTranslucent.M_HL2_LitTranslucent
ParentMaterial_LightmappedGeneric_Decal=/HL2BSPImporter/MasterMaterials/M_HL2_LitDecal.M_HL2_LitDecal
ParentMaterial_WorldVertexTransition=/HL2BSPImporter/MasterMaterials/M_HL2_WorldVertexBlend.M_HL2_WorldVertexBlend
ParentMaterial_VertexLitGeneric=/HL2BSPImporter/MasterMaterials/M_HL2_VertexLit.M_HL2_VertexLit
ParentMaterial_UnlitGeneric=/HL2BSPImporter/MasterMaterials/M_HL2_Unlit.M_HL2_Unlit
